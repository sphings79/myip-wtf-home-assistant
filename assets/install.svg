<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Installation in four steps: open HACS, install MyIP.wtf, restart Home Assistant, then add the integration and pick your IP versions">
  <defs>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .h { font-size: 19px; font-weight: 700; fill: #e6edf3; }
      .s { font-size: 14px; fill: #9fb0c0; }
      .n { font-size: 22px; font-weight: 800; fill: #0f1720; }
    </style>
    <marker id="iah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#33465a"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="20" fill="#0f1720"/>
  <rect x="1" y="1" width="1198" height="378" rx="20" fill="none" stroke="#243141" stroke-width="2"/>
  <text class="t" x="40" y="46" font-size="13" letter-spacing="2" font-weight="600" fill="#7d8fa1">INSTALLATION IN FOUR STEPS</text>

  <g class="t">
    <rect x="40" y="80" width="256" height="240" rx="14" fill="#16202b" stroke="#28394a" stroke-width="2"/>
    <circle cx="72" cy="120" r="20" fill="#41BDF5"/><text class="n" x="72" y="128" text-anchor="middle">1</text>
    <text class="h" x="104" y="128">Open HACS</text>
    <text class="s" x="64" y="176">Open HACS from the</text>
    <text class="s" x="64" y="198">sidebar. Search is all</text>
    <text class="s" x="64" y="232">you need: it is in the</text>
    <text class="s" x="64" y="254">default catalog.</text>
    <text class="s" x="64" y="276" fill="#7fd4f7">No custom repository.</text>

    <path d="M304 200 H336" stroke="#33465a" stroke-width="2.5" marker-end="url(#iah)"/>

    <rect x="344" y="80" width="256" height="240" rx="14" fill="#16202b" stroke="#28394a" stroke-width="2"/>
    <circle cx="376" cy="120" r="20" fill="#41BDF5"/><text class="n" x="376" y="128" text-anchor="middle">2</text>
    <text class="h" x="408" y="128">Install</text>
    <text class="s" x="368" y="176">Search for</text>
    <text class="s" x="368" y="198" fill="#7fd4f7">MyIP.wtf</text>
    <text class="s" x="368" y="232">and press Download.</text>
    <text class="s" x="368" y="254">No API key, no account,</text>
    <text class="s" x="368" y="276">no extra dependencies.</text>

    <path d="M608 200 H640" stroke="#33465a" stroke-width="2.5" marker-end="url(#iah)"/>

    <rect x="648" y="80" width="256" height="240" rx="14" fill="#16202b" stroke="#28394a" stroke-width="2"/>
    <circle cx="680" cy="120" r="20" fill="#41BDF5"/><text class="n" x="680" y="128" text-anchor="middle">3</text>
    <text class="h" x="712" y="128">Restart</text>
    <text class="s" x="672" y="176">Settings → System →</text>
    <text class="s" x="672" y="198">Restart Home Assistant</text>
    <text class="s" x="672" y="232">so the new</text>
    <text class="s" x="672" y="254">integration is loaded.</text>

    <path d="M912 200 H944" stroke="#33465a" stroke-width="2.5" marker-end="url(#iah)"/>

    <rect x="952" y="80" width="208" height="240" rx="14" fill="#16202b" stroke="#2f6d54" stroke-width="2"/>
    <circle cx="984" cy="120" r="20" fill="#3ddc97"/><text class="n" x="984" y="128" text-anchor="middle">4</text>
    <text class="h" x="1016" y="128">Add it</text>
    <text class="s" x="976" y="176">Settings → Devices &amp;</text>
    <text class="s" x="976" y="198">services → Add</text>
    <text class="s" x="976" y="220">integration</text>
    <text class="s" x="976" y="254">Choose IPv4 / IPv6</text>
    <text class="s" x="976" y="276">and the interval.</text>
  </g>
</svg>
