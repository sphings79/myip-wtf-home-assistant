<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Entity overview: the MyIP.wtf integration creates one device per IP version with eight sensors and two binary sensors each">
  <defs>
    <style>
      .t  { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .h  { font-size: 20px; font-weight: 700; fill: #e6edf3; }
      .k  { font-size: 15px; fill: #9fb0c0; }
      .v  { font-size: 15px; fill: #e6edf3; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .lbl{ font-size: 13px; fill: #7d8fa1; letter-spacing: 2px; font-weight: 600; }
      .row{ stroke: #22303e; stroke-width: 1; }
      .chip{ font-size: 12px; font-weight: 700; fill: #0f1720; }
    </style>
  </defs>

  <rect width="1200" height="700" rx="20" fill="#0f1720"/>
  <rect x="1" y="1" width="1198" height="698" rx="20" fill="none" stroke="#243141" stroke-width="2"/>
  <text class="t lbl" x="40" y="46">ENTITIES CREATED PER IP VERSION</text>

  <!-- IPv4 device -->
  <g class="t">
    <rect x="40" y="72" width="548" height="596" rx="16" fill="#16202b" stroke="#28394a" stroke-width="2"/>
    <rect x="40" y="72" width="548" height="56" rx="16" fill="#1b2733"/>
    <rect x="40" y="112" width="548" height="16" fill="#1b2733"/>
    <rect x="64" y="88" width="52" height="24" rx="12" fill="#41BDF5"/>
    <text class="chip" x="90" y="105" text-anchor="middle">IPv4</text>
    <text class="h" x="132" y="108" font-size="18">MyIP.wtf IPv4</text>

    <g>
      <text class="k" x="64" y="176">IP address</text>            <text class="v" x="564" y="176" text-anchor="end" fill="#7fd4f7">203.0.113.7</text>
      <line class="row" x1="64" y1="194" x2="564" y2="194"/>
      <text class="k" x="64" y="226">Hostname</text>              <text class="v" x="564" y="226" text-anchor="end">host.example.net</text>
      <line class="row" x1="64" y1="244" x2="564" y2="244"/>
      <text class="k" x="64" y="276">Internet provider</text>     <text class="v" x="564" y="276" text-anchor="end">Example Telecom</text>
      <line class="row" x1="64" y1="294" x2="564" y2="294"/>
      <text class="k" x="64" y="326">Location</text>              <text class="v" x="564" y="326" text-anchor="end">Lemgo, NW, Germany</text>
      <line class="row" x1="64" y1="344" x2="564" y2="344"/>
      <text class="k" x="64" y="376">City</text>                  <text class="v" x="564" y="376" text-anchor="end">Lemgo</text>
      <line class="row" x1="64" y1="394" x2="564" y2="394"/>
      <text class="k" x="64" y="426">Country</text>               <text class="v" x="564" y="426" text-anchor="end">Germany</text>
      <line class="row" x1="64" y1="444" x2="564" y2="444"/>
      <text class="k" x="64" y="476">Country code</text>
      <text class="v" x="564" y="476" text-anchor="end">DE</text>
      <line class="row" x1="64" y1="494" x2="564" y2="494"/>
      <text class="k" x="64" y="526">IP changed at</text>         <text class="v" x="564" y="526" text-anchor="end">2026-08-25 06:12</text>
      <line class="row" x1="64" y1="544" x2="564" y2="544"/>
      <text class="k" x="64" y="576">Tor exit node</text>         <text class="v" x="564" y="576" text-anchor="end" fill="#3ddc97">off</text>
      <line class="row" x1="64" y1="594" x2="564" y2="594"/>
      <text class="k" x="64" y="626">Reachable</text>             <text class="v" x="564" y="626" text-anchor="end" fill="#3ddc97">connected</text>
    </g>
  </g>

  <!-- IPv6 device -->
  <g class="t">
    <rect x="612" y="72" width="548" height="596" rx="16" fill="#16202b" stroke="#28394a" stroke-width="2"/>
    <rect x="612" y="72" width="548" height="56" rx="16" fill="#1b2733"/>
    <rect x="612" y="112" width="548" height="16" fill="#1b2733"/>
    <rect x="636" y="88" width="52" height="24" rx="12" fill="#A78BFA"/>
    <text class="chip" x="662" y="105" text-anchor="middle">IPv6</text>
    <text class="h" x="704" y="108" font-size="18">MyIP.wtf IPv6</text>

    <g>
      <text class="k" x="636" y="176">IP address</text>           <text class="v" x="1136" y="176" text-anchor="end" font-size="13" fill="#c4b5fd">2001:db8:1a2b::7f</text>
      <line class="row" x1="636" y1="194" x2="1136" y2="194"/>
      <text class="k" x="636" y="226">Hostname</text>             <text class="v" x="1136" y="226" text-anchor="end" font-size="13">v6.example.net</text>
      <line class="row" x1="636" y1="244" x2="1136" y2="244"/>
      <text class="k" x="636" y="276">Internet provider</text>    <text class="v" x="1136" y="276" text-anchor="end">Example Telecom</text>
      <line class="row" x1="636" y1="294" x2="1136" y2="294"/>
      <text class="k" x="636" y="326">Location</text>             <text class="v" x="1136" y="326" text-anchor="end">Lemgo, NW, Germany</text>
      <line class="row" x1="636" y1="344" x2="1136" y2="344"/>
      <text class="k" x="636" y="376">City</text>                 <text class="v" x="1136" y="376" text-anchor="end">Lemgo</text>
      <line class="row" x1="636" y1="394" x2="1136" y2="394"/>
      <text class="k" x="636" y="426">Country</text>              <text class="v" x="1136" y="426" text-anchor="end">Germany</text>
      <line class="row" x1="636" y1="444" x2="1136" y2="444"/>
      <text class="k" x="636" y="476">Country code</text>         <text class="v" x="1136" y="476" text-anchor="end">DE</text>
      <line class="row" x1="636" y1="494" x2="1136" y2="494"/>
      <text class="k" x="636" y="526">IP changed at</text>        <text class="v" x="1136" y="526" text-anchor="end">2026-08-25 06:13</text>
      <line class="row" x1="636" y1="544" x2="1136" y2="544"/>
      <text class="k" x="636" y="576">Tor exit node</text>        <text class="v" x="1136" y="576" text-anchor="end" fill="#3ddc97">off</text>
      <line class="row" x1="636" y1="594" x2="1136" y2="594"/>
      <text class="k" x="636" y="626">Reachable</text>            <text class="v" x="1136" y="626" text-anchor="end" fill="#3ddc97">connected</text>
    </g>
  </g>
</svg>
