<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Example Home Assistant dashboard with a MyIP.wtf entities card, a Tor and reachability card, and a logbook of public IP address changes">
  <defs>
    <style>
      .t  { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .ct { font-size: 17px; font-weight: 700; fill: #e6edf3; }
      .k  { font-size: 14px; fill: #9fb0c0; }
      .v  { font-size: 14px; fill: #e6edf3; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .row{ stroke: #22303e; stroke-width: 1; }
      .lbl{ font-size: 13px; fill: #7d8fa1; letter-spacing: 2px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="540" rx="20" fill="#0d1319"/>
  <rect x="1" y="1" width="1198" height="538" rx="20" fill="none" stroke="#243141" stroke-width="2"/>
  <text class="t lbl" x="40" y="46">EXAMPLE DASHBOARD</text>

  <!-- Card 1: entities -->
  <g class="t">
    <rect x="40" y="76" width="360" height="424" rx="14" fill="#1b2733" stroke="#28394a"/>
    <text class="ct" x="64" y="118">Internet connection</text>
    <text class="k" x="64" y="164">IPv4</text>          <text class="v" x="376" y="164" text-anchor="end" fill="#7fd4f7">203.0.113.7</text>
    <line class="row" x1="64" y1="184" x2="376" y2="184"/>
    <text class="k" x="64" y="214">IPv6</text>          <text class="v" x="376" y="214" text-anchor="end" font-size="12" fill="#c4b5fd">2001:db8:1a2b::7f</text>
    <line class="row" x1="64" y1="234" x2="376" y2="234"/>
    <text class="k" x="64" y="264">Provider</text>      <text class="v" x="376" y="264" text-anchor="end">Example Telecom</text>
    <line class="row" x1="64" y1="284" x2="376" y2="284"/>
    <text class="k" x="64" y="314">Hostname</text>      <text class="v" x="376" y="314" text-anchor="end" font-size="12">host.example.net</text>
    <line class="row" x1="64" y1="334" x2="376" y2="334"/>
    <text class="k" x="64" y="364">Country</text>       <text class="v" x="376" y="364" text-anchor="end">Germany</text>
    <line class="row" x1="64" y1="384" x2="376" y2="384"/>
    <text class="k" x="64" y="414">City</text>          <text class="v" x="376" y="414" text-anchor="end">Lemgo</text>
    <line class="row" x1="64" y1="434" x2="376" y2="434"/>
    <text class="k" x="64" y="464">Changed</text>       <text class="v" x="376" y="464" text-anchor="end">today, 06:12</text>
  </g>

  <!-- Card 2: status tiles -->
  <g class="t">
    <rect x="424" y="76" width="360" height="200" rx="14" fill="#1b2733" stroke="#28394a"/>
    <text class="ct" x="448" y="118">Connection health</text>
    <rect x="448" y="142" width="150" height="104" rx="12" fill="#132420" stroke="#2f6d54"/>
    <circle cx="482" cy="180" r="14" fill="#3ddc97" opacity="0.25"/><circle cx="482" cy="180" r="6" fill="#3ddc97"/>
    <text class="k" x="508" y="176" fill="#7fe9bd">IPv4</text>
    <text class="k" x="508" y="196" font-size="12">reachable</text>
    <text class="k" x="470" y="230" font-size="12">Tor exit: off</text>

    <rect x="610" y="142" width="150" height="104" rx="12" fill="#132420" stroke="#2f6d54"/>
    <circle cx="644" cy="180" r="14" fill="#3ddc97" opacity="0.25"/><circle cx="644" cy="180" r="6" fill="#3ddc97"/>
    <text class="k" x="670" y="176" fill="#7fe9bd">IPv6</text>
    <text class="k" x="670" y="196" font-size="12">reachable</text>
    <text class="k" x="632" y="230" font-size="12">Tor exit: off</text>

    <rect x="424" y="300" width="360" height="200" rx="14" fill="#1b2733" stroke="#28394a"/>
    <text class="ct" x="448" y="342">Polling budget</text>
    <text class="k" x="448" y="378">Interval</text>       <text class="v" x="760" y="378" text-anchor="end">15 min</text>
    <line class="row" x1="448" y1="396" x2="760" y2="396"/>
    <text class="k" x="448" y="426">Requests / hour</text><text class="v" x="760" y="426" text-anchor="end">8</text>
    <line class="row" x1="448" y1="444" x2="760" y2="444"/>
    <text class="k" x="448" y="474">Policy limit</text>   <text class="v" x="760" y="474" text-anchor="end" fill="#3ddc97">60 / hour</text>
  </g>

  <!-- Card 3: logbook -->
  <g class="t">
    <rect x="808" y="76" width="352" height="424" rx="14" fill="#1b2733" stroke="#28394a"/>
    <text class="ct" x="832" y="118">Public IP history</text>
    <g>
      <circle cx="840" cy="164" r="5" fill="#41BDF5"/>
      <text class="k" x="860" y="160" fill="#e6edf3" font-size="13">IPv4 changed</text>
      <text class="v" x="860" y="182" font-size="12" fill="#7fd4f7">198.51.100.4 → 203.0.113.7</text>
      <text class="k" x="860" y="202" font-size="12">today, 06:12</text>

      <circle cx="840" cy="252" r="5" fill="#A78BFA"/>
      <text class="k" x="860" y="248" fill="#e6edf3" font-size="13">IPv6 prefix changed</text>
      <text class="v" x="860" y="270" font-size="11" fill="#c4b5fd">2001:db8:99:: → 2001:db8:1a2b::</text>
      <text class="k" x="860" y="290" font-size="12">today, 06:13</text>

      <circle cx="840" cy="340" r="5" fill="#41BDF5"/>
      <text class="k" x="860" y="336" fill="#e6edf3" font-size="13">IPv4 changed</text>
      <text class="v" x="860" y="358" font-size="12" fill="#7fd4f7">192.0.2.55 → 198.51.100.4</text>
      <text class="k" x="860" y="378" font-size="12">yesterday, 06:09</text>

      <line x1="840" y1="176" x2="840" y2="240" stroke="#2b3a4a" stroke-width="2"/>
      <line x1="840" y1="264" x2="840" y2="328" stroke="#2b3a4a" stroke-width="2"/>

      <text class="k" x="832" y="440" font-size="12" fill="#6f8194">Fed by the</text>
      <text class="v" x="832" y="462" font-size="12" fill="#ffd257">myip_wtf_ip_changed</text>
      <text class="k" x="832" y="482" font-size="12" fill="#6f8194">event.</text>
    </g>
  </g>
</svg>
