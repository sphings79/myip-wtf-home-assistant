<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="MyIP.wtf — public IPv4 and IPv6 address sensors for Home Assistant">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16212c"/>
      <stop offset="0.55" stop-color="#101820"/>
      <stop offset="1" stop-color="#0b1117"/>
    </linearGradient>
    <linearGradient id="sglobe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41BDF5"/>
      <stop offset="1" stop-color="#7C7CF5"/>
    </linearGradient>
    <pattern id="sgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1b2733" stroke-width="1"/>
    </pattern>
    <radialGradient id="sglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#41BDF5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#41BDF5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#sbg)"/>
  <rect width="1280" height="640" fill="url(#sgrid)" opacity="0.65"/>
  <ellipse cx="1040" cy="200" rx="380" ry="300" fill="url(#sglow)"/>

  <g transform="translate(920 176) scale(0.55)">
    <g fill="none" stroke="url(#sglobe)" stroke-width="26" stroke-linecap="round" opacity="0.92">
      <circle cx="256" cy="256" r="224"/>
      <ellipse cx="256" cy="256" rx="106" ry="224"/>
      <path d="M43 186h426M43 326h426"/>
    </g>
    <circle cx="256" cy="256" r="36" fill="#FFC107"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="96" y="176" font-size="20" font-weight="bold" letter-spacing="6" fill="#41BDF5">HOME ASSISTANT · HACS INTEGRATION</text>
    <text x="96" y="290" font-size="96" font-weight="bold" fill="#ffffff">MyIP<tspan fill="#41BDF5">.wtf</tspan></text>
    <text x="96" y="350" font-size="38" font-weight="bold" fill="#e6edf3">Public IPv4 &amp; IPv6 address sensors</text>
    <text x="96" y="400" font-size="25" fill="#9fb0c0">WAN address, ISP, country and Tor exit status —</text>
    <text x="96" y="436" font-size="25" fill="#9fb0c0">no API key, no account.</text>

    <g font-size="21" font-weight="bold">
      <rect x="96" y="486" width="250" height="52" rx="26" fill="#16222d" stroke="#2b6f8f" stroke-width="2"/>
      <text x="124" y="519" fill="#7fd4f7">1 request / minute</text>
      <rect x="366" y="486" width="196" height="52" rx="26" fill="#16222d" stroke="#2f6d54" stroke-width="2"/>
      <text x="394" y="519" fill="#5fe3ae">No API key</text>
      <rect x="582" y="486" width="212" height="52" rx="26" fill="#16222d" stroke="#6b5a2a" stroke-width="2"/>
      <text x="610" y="519" fill="#ffd257">UI config flow</text>
    </g>
  </g>
</svg>
